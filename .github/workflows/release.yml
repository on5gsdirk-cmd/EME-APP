name: Release

# Publiceert een GitHub-release met een ondertekende APK zodra er op main een nieuwe
# versionName staat (in app/build.gradle.kts) waarvoor nog geen release bestaat.
# De release-pull request wordt gemaakt volgens .claude/skills/release/SKILL.md.
#
# Nodig (eenmalig, door de eigenaar, zie issue #36): een environment "release", beperkt tot
# branch main, met de secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS en RELEASE_KEY_PASSWORD.

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | tr -d '\r')
          echo "versionName: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::notice::versionName '$version' is not MAJOR.MINOR.PATCH, so no release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release v$version already exists, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::docs/releases/v$version.md is missing. Every release needs its release notes."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # SHA-256 van het certificaat waarmee alle gepubliceerde APK's ondertekend zijn (v0.16 en later).
      # Dit is geen geheim: het certificaat zit in elke APK. Een andere sleutel breekt de updates.
      EXPECTED_CERT_SHA256: 124b9baeee627d2f9077a8de20f4ea846cbf62649527fcef03d78216e21a3b5e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Write the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing in environment 'release' (see issue #36)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          # Eén regel per handtekeningschema ("V2 Signer: certificate SHA-256 digest: ..."); allemaal dezelfde sleutel
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' certs.txt | sort -u | paste -sd ' ')
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with certificate $actual, expected $EXPECTED_CERT_SHA256. Not published: it would not install over the current app."
            exit 1
          fi
          cp "$apk" EME-APP.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" EME-APP.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EME APP $VERSION" \
            --notes-file "docs/releases/v$VERSION.md" \
            $prerelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
